<div class="flex min-h-screen w-screen">
  <!-- Sidebar -->
  <aside class="shrink-0 bg-surface-low">
    <app-sidebar [mobileMenuOpen]="sidebarOpen()" (closeMobileMenu)="closeSidebar()" />
  </aside>

  <!-- Right side wrapper -->
  <div class="flex min-w-0 flex-1 flex-col bg-background">
    <!-- Header -->
    <header class="shrink-0">
      <app-header (menuToggle)="toggleSidebar()" />
    </header>

    <!-- Content -->
    <main class="min-h-0 flex-1 overflow-y-auto pb-16 lg:pb-0">
      <router-outlet />
    </main>
  </div>

  <!-- Mobile footer navigation -->
  <footer class="fixed inset-x-0 bottom-0 z-40 lg:hidden">
    <nav
      class="flex h-16 items-center justify-center border-t border-slate-light py-4 bg-surface-low"
    >
      <a
        routerLink="/projects"
        routerLinkActive="text-primary"
        class="flex flex-col items-center gap-1 text-slate-medium"
      >
        <img src="assets/icons/folder.svg" alt="" class="size-6" />

        <span class="text-[11px] font-medium"> Projects </span>
      </a>
    </nav>
  </footer>
</div>
