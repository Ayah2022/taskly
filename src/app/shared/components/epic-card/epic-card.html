<article
  class="flex min-h-[210px] flex-col rounded-md border border-slate-200 border-l-4 border-l-primary bg-white p-4 shadow-sm"
>
  <!-- Epic ID -->
  <div>
    <span
      class="inline-flex rounded-sm bg-indigo-100 px-2 py-1 text-[10px] font-bold tracking-wide text-primary"
    >
      {{ epicId() }}
    </span>
  </div>

  <!-- Epic title -->
  <h2 class="mt-4 line-clamp-2 text-lg font-semibold leading-6 text-slate-900">{{ title() }}</h2>

  <!-- Assignee -->
  <div class="mt-3 flex items-center gap-3">
    <div
      class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-primary text-sm font-semibold text-white"
      aria-hidden="true"
    >
      {{ assigneeInitials }}
    </div>

    <div class="min-w-0">
      <p class="text-xs text-slate-600">Assignee</p>

      <p class="truncate text-sm font-semibold text-slate-900">
        {{ assignee()?.name || 'Unassigned' }}
      </p>
    </div>
  </div>

  <!-- Footer -->
  <div
    class="mt-auto flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-t border-slate-100 pt-4 text-[11px] text-slate-500"
  >
    <div class="flex min-w-0 items-center gap-2">
      <img src="assets/icons/user-round.svg" alt="" class="size-3 shrink-0" />

      <span class="truncate">
        Created by:
        <span class="font-medium text-slate-800"> {{ creator()?.name || '—' }} </span>
      </span>
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <img src="assets/icons/calendar.svg" alt="" class="size-3 shrink-0" />

      <time [attr.datetime]="createdAt()"> {{ formatDate(createdAt()) }} </time>
    </div>
  </div>
</article>
